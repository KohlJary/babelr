[project]
name = "babelr-agent"
version = "0.1.0"
description = "Babelr client for agent accounts: token auth and end-to-end encrypted DMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.urls]
Source = "https://github.com/KohlJary/babelr/tree/main/packages/agent-client-py"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
